name: barq
description: Barq towing app with PocketBase backend and Bahrain map support.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  pocketbase: ^0.23.2
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  shared_preferences: ^2.3.0
  geolocator: ^11.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/white_mod.png
    - lib/src/logo/white_mod.png
    - lib/src/logo/file_00000000decc7246a92d743d9b9850f3.png
    - lib/src/logo/file_0000000031dc72468f1c079a0115f272.png
